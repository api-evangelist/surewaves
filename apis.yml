name: SureWaves
description: 'SureWaves is a broadcast-television advertising technology company that integrates linear
  TV with digital advertising infrastructure. It provides AI-powered spot and yield management for
  broadcasters and real-time, pay-for-performance campaign tooling for advertisers, and operates India''s
  largest spot TV network — more than 20 million spots monthly across 550+ local channels reaching 490+
  million households. Holder of 50+ patents, backed by Accel, with offices in Bangalore, New York, McLean,
  Mumbai and New Delhi. Added to the API Evangelist network as a portfolio-lead stub; two enrichment passes
  (2026-07 and 2026-08) found no public API, developer portal, SDK, package, or machine-readable contract of
  any kind — the platform is sold as an enterprise engagement behind a "Request Meeting" form. The company
  does display a SOC 2 Type II badge on its homepage, attested by Prescient Assurance against AICPA SSAE 18.'
